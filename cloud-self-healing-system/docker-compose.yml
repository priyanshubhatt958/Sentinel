services:
  database:
    image: postgres:16-alpine
    container_name: cloud-db
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-cloud_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      POSTGRES_DB: ${POSTGRES_DB:-cloud_self_healing}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-cloud_user} -d ${POSTGRES_DB:-cloud_self_healing}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

  db-migrate:
    image: postgres:16-alpine
    environment:
      PGHOST: database
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-cloud_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      PGDATABASE: ${POSTGRES_DB:-cloud_self_healing}
    volumes:
      - ./database/schema.sql:/schema.sql:ro
    command: ["sh", "-c", "psql -v ON_ERROR_STOP=1 -f /schema.sql"]
    depends_on:
      database:
        condition: service_healthy

  payment-service:
    build:
      context: ./services
      dockerfile: payment-service/Dockerfile
    restart: unless-stopped
    environment:
      PORT: 8002
      SERVICE_NAME: payment-service
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-cloud_self_healing}
      DATABASE_USER: ${POSTGRES_USER:-cloud_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-5000}
      SIMULATION_MAX_DURATION_MS: ${SIMULATION_MAX_DURATION_MS:-60000}
      CPU_LOAD_PERCENT: ${CPU_LOAD_PERCENT:-70}
      MEMORY_LOAD_MB: ${MEMORY_LOAD_MB:-100}
      DATABASE_DELAY_MS: ${DATABASE_DELAY_MS:-300}
      DATABASE_QUERY_MULTIPLIER: ${DATABASE_QUERY_MULTIPLIER:-5}
      NODE_ENV: production
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8002/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  payment-gateway:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports:
      - "8002:8002"
    volumes:
      - ./monitoring-backend/nginx/payment-gateway.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "wget -q -O /dev/null http://127.0.0.1:8002/health"]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  order-service:
    build:
      context: ./services
      dockerfile: order-service/Dockerfile
    container_name: order-service
    restart: unless-stopped
    environment:
      PORT: 8001
      SERVICE_NAME: order-service
      PAYMENT_SERVICE_URL: http://payment-service:8002
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-cloud_self_healing}
      DATABASE_USER: ${POSTGRES_USER:-cloud_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-5000}
      SIMULATION_MAX_DURATION_MS: ${SIMULATION_MAX_DURATION_MS:-60000}
      CPU_LOAD_PERCENT: ${CPU_LOAD_PERCENT:-70}
      MEMORY_LOAD_MB: ${MEMORY_LOAD_MB:-100}
      DATABASE_DELAY_MS: ${DATABASE_DELAY_MS:-300}
      DATABASE_QUERY_MULTIPLIER: ${DATABASE_QUERY_MULTIPLIER:-5}
      NODE_ENV: production
    ports:
      - "8001:8001"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      payment-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8001/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  user-service:
    build:
      context: ./services
      dockerfile: user-service/Dockerfile
    container_name: user-service
    restart: unless-stopped
    environment:
      PORT: 8003
      SERVICE_NAME: user-service
      DATABASE_HOST: database
      DATABASE_PORT: 5432
      DATABASE_NAME: ${POSTGRES_DB:-cloud_self_healing}
      DATABASE_USER: ${POSTGRES_USER:-cloud_user}
      DATABASE_PASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      DB_POOL_MAX: ${DB_POOL_MAX:-20}
      DB_POOL_IDLE_TIMEOUT_MS: ${DB_POOL_IDLE_TIMEOUT_MS:-30000}
      DB_QUERY_TIMEOUT_MS: ${DB_QUERY_TIMEOUT_MS:-5000}
      SIMULATION_MAX_DURATION_MS: ${SIMULATION_MAX_DURATION_MS:-60000}
      CPU_LOAD_PERCENT: ${CPU_LOAD_PERCENT:-70}
      MEMORY_LOAD_MB: ${MEMORY_LOAD_MB:-100}
      DATABASE_DELAY_MS: ${DATABASE_DELAY_MS:-300}
      DATABASE_QUERY_MULTIPLIER: ${DATABASE_QUERY_MULTIPLIER:-5}
      NODE_ENV: production
    ports:
      - "8003:8003"
    depends_on:
      db-migrate:
        condition: service_completed_successfully
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8003/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 20s

  load-generator:
    build:
      context: ./load-generator
    container_name: load-generator
    restart: unless-stopped
    environment:
      PORT: 8004
      PAYMENT_SERVICE_URL: http://payment-service:8002/payments
      ORDER_SERVICE_URL: http://order-service:8001/orders
      USER_SERVICE_URL: http://user-service:8003/users
      NODE_ENV: production
    ports:
      - "8004:8004"
    depends_on:
      payment-service:
        condition: service_healthy
      order-service:
        condition: service_healthy
      user-service:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:8004/health').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 10s

  monitoring-backend:
    build:
      context: ./monitoring-backend
    container_name: monitoring-backend
    restart: unless-stopped
    environment:
      PORT: 5000
      PGHOST: database
      PGPORT: 5432
      PGUSER: ${POSTGRES_USER:-cloud_user}
      PGPASSWORD: ${POSTGRES_PASSWORD:-cloud_password}
      PGDATABASE: ${POSTGRES_DB:-cloud_self_healing}
      ML_SERVICE_URL: http://ml-service:8000
      LOAD_GENERATOR_URL: http://load-generator:8004
      AUTO_RECOVERY_ENABLED: ${AUTO_RECOVERY_ENABLED:-false}
      AUTO_RECOVERY_MAX_ACTIONS_PER_HOUR: ${AUTO_RECOVERY_MAX_ACTIONS_PER_HOUR:-5}
      RECOVERY_COOLDOWN_MS: ${RECOVERY_COOLDOWN_MS:-120000}
      MAX_RECOVERY_ACTIONS_PER_INCIDENT: ${MAX_RECOVERY_ACTIONS_PER_INCIDENT:-3}
      MAX_RECOVERY_ACTIONS_PER_SERVICE_PER_HOUR: ${MAX_RECOVERY_ACTIONS_PER_SERVICE_PER_HOUR:-5}
      RECOVERY_MAX_FAILURES_BEFORE_MANUAL: ${RECOVERY_MAX_FAILURES_BEFORE_MANUAL:-3}
      RECOVERY_VERIFICATION_DELAY_MS: ${RECOVERY_VERIFICATION_DELAY_MS:-30000}
      RECOVERY_VERIFICATION_SAMPLES: ${RECOVERY_VERIFICATION_SAMPLES:-6}
      MAX_SERVICE_REPLICAS: ${MAX_SERVICE_REPLICAS:-5}
      MIN_SERVICE_REPLICAS: ${MIN_SERVICE_REPLICAS:-1}
      GENAI_API_KEY: ${GENAI_API_KEY:-}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      GENAI_ENABLED: ${GENAI_ENABLED:-false}
      GENAI_API_URL: ${GENAI_API_URL:-https://api.openai.com/v1/chat/completions}
      GENAI_MODEL: ${GENAI_MODEL:-gpt-4o-mini}
      COMPOSE_PROJECT_NAME: ${COMPOSE_PROJECT_NAME:-cloud-self-healing-system}
      COMPOSE_PROJECT_DIRECTORY: /workspace
      COMPOSE_FILE_PATH: /workspace/docker-compose.yml
      MONITORING_INTERVAL_MS: ${MONITORING_INTERVAL_MS:-5000}
      MONITORING_PROBE_TIMEOUT_MS: ${MONITORING_PROBE_TIMEOUT_MS:-3000}
      MONITORING_RETENTION_DAYS: ${MONITORING_RETENTION_DAYS:-7}
      NODE_ENV: production
    ports:
      - "5000:5000"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./:/workspace:ro
    depends_on:
      db-migrate:
        condition: service_completed_successfully
      database:
        condition: service_healthy
      ml-service:
        condition: service_healthy
      load-generator:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5000/api/services/status').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 6
      start_period: 30s

  ml-service:
    build:
      context: ./ml-service
    container_name: ml-service
    restart: unless-stopped
    environment:
      PORT: 8000
      PYTHONUNBUFFERED: 1
      GENAI_ENABLED: ${GENAI_ENABLED:-false}
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/ml/health').read()\" || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s

  frontend:
    build:
      context: ./frontend
    container_name: frontend
    restart: unless-stopped
    environment:
      VITE_API_URL: http://localhost:5000
    ports:
      - "5173:5173"
    depends_on:
      monitoring-backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "node -e \"fetch('http://localhost:5173').then(r=>process.exit(r.ok?0:1)).catch(()=>process.exit(1))\""]
      interval: 10s
      timeout: 5s
      retries: 8
      start_period: 20s

volumes:
  postgres_data:
